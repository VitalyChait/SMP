<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Social Media Police Settings</title>
  <style>
    body { width: 300px; padding: 10px; font-family: sans-serif; }
    .container { display: flex; flex-direction: column; gap: 10px; }
    label { font-weight: bold; }
    input, select { padding: 5px; }
    button { padding: 8px; background-color: #4267B2; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #365899; }
    #validateBtn { background-color: #6c757d; }
    #validateBtn:hover { background-color: #5a6268; }
    .status { margin-top: 5px; font-size: 0.9em; color: green; }
    .dashboard-link { text-align: center; margin-top: 10px; }
    a { color: #4267B2; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hint { font-size: 0.8em; color: #666; margin-top: -5px; }
    .btn-group { display: flex; gap: 5px; }
    .btn-group button { flex: 1; }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #4267B2; }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h3>Social Media Police</h3>
      <label class="toggle-switch">
        <input type="checkbox" id="extensionToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <label for="provider">AI Provider:</label>
    <select id="provider">
      <option value="openai">OpenAI</option>
      <option value="openrouter">OpenRouter</option>
      <option value="gemini">Google Gemini</option>
      <option value="anthropic">Anthropic Claude</option>
    </select>

    <label for="modelName">Model Name (Optional):</label>
    <input type="text" id="modelName" placeholder="e.g. gpt-4o, gemini-1.5-pro">
    <div class="hint">Leave empty to use default model</div>

    <label for="apiKey">API Key:</label>
    <input type="password" id="apiKey" placeholder="Paste your API key here...">
    
    <div class="btn-group">
      <button id="validateBtn">Validate Model</button>
      <button id="saveBtn">Save Settings</button>
    </div>
    <div id="status" class="status"></div>

    <hr>
    
    <div class="dashboard-link">
      <a href="#" id="openDashboard">📊 Open Ranking Dashboard</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
